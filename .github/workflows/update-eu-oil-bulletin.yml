name: Update EU Oil Bulletin

on:
  schedule:
    # every wednesday at 14:00 utc, bulletin drops wednesdays
    - cron: "0 14 * * 3"
  workflow_dispatch:  # also lets me trigger it manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt kaggle huggingface_hub

      - name: Wipe old CSV so the script re-downloads
        # script bails out early if the csv is already there, so kill it first
        run: rm -f datasets/02_eu_oil_bulletin/output/eu_oil_bulletin/eu_oil_bulletin.csv

      - name: Run scraper
        working-directory: datasets/02_eu_oil_bulletin
        run: python 02_eu_oil_bulletin.py

      - name: Push to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        working-directory: datasets/02_eu_oil_bulletin/output/eu_oil_bulletin
        run: kaggle datasets version -m "weekly update $(date -u +%Y-%m-%d)"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload FionnHughes/eu-weekly-oil-bulletin \
            datasets/02_eu_oil_bulletin/output/eu_oil_bulletin \
            --repo-type dataset \
            --exclude dataset-metadata.json \
            --commit-message "weekly update $(date -u +%Y-%m-%d)"
