name: Update Property Price Register

on:
  schedule:
    # 1st of the month, 3am UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:  # also lets me trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: datasets/01_property_price_register
        run: python 01_property_price_register.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datasets/01_property_price_register/output/
          git diff --staged --quiet || git commit -m "update PPR data $(date -u +%Y-%m-%d)"
          git push

      # kaggle push - needs KAGGLE_USERNAME and KAGGLE_KEY in repo secrets,
